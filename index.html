<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR HAAS NET - Siza Ukerewe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1115;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#1a1d24;border-radius:20px;padding:30px;width:95%;max-width:380px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h1{font-size:28px;color:#00ff88}
.loc{color:#aaa;margin:5px 0 20px}
input{width:100%;padding:14px;border-radius:10px;border:none;margin:10px 0;background:#2a2d35;color:#fff;font-size:16px;text-align:center}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#00ff88;color:#000;font-weight:bold;font-size:16px;margin-top:10px}
.status{margin-top:15px;padding:10px;border-radius:8px;background:#2a2d35;font-size:13px}
.online{color:#00ff88}
</style>
</head>
<body>
<div class="card">
<h1>MR HAAS NET</h1>
<div class="loc">Siza - Ukerewe | 10.10.0.65</div>
<div id="backendStatus" class="status">Inaunganisha na Backend...</div>
<input id="voucher" placeholder="Weka Voucher Code">
<button onclick="login()">INGIA MTANDAONI</button>
<div style="margin-top:15px;font-size:12px;color:#888">Mfano: HAAS48-9PM-7E5<br>mrhaas.net | mrhaasnet.duckdns.org</div>
</div>
<script>
const API_URL = "https://mr-haas-net-backend.onrender.com";
async function checkBackend(){
  try{
    const r = await fetch(API_URL + "/api/status");
    const d = await r.json();
    document.getElementById("backendStatus").innerHTML = '<span class="online">● Online</span> - ' + d.name + ' - ' + d.location + ' | Clients: ' + d.clients;
  }catch(e){
    document.getElementById("backendStatus").innerText = "Backend offline - Inajaribu tena...";
    setTimeout(checkBackend,3000);
  }
}
async function login(){
  const v = document.getElementById("voucher").value.trim();
  if(!v){alert("Weka Voucher!");return}
  try{
    const res = await fetch(API_URL + "/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({voucher:v})
    });
    const data = await res.json();
    if(data.success){
      alert("✅ " + data.message + " - Karibu MR HAAS NET!");
    }else{
      alert("❌ " + data.message);
    }
  }catch(e){
    alert("Tatizo la mtandao - Jaribu tena");
  }
}
checkBackend();
</script>
</body>
</html>
